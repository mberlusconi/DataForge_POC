name: Continuous Deployment - Production Deploy

on:
  push:
    branches:
      - main

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
  SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  SNOWFLAKE_DATABASE: POC_MEDALLION_CICD

jobs:
  deploy_prod:
    name: Deploy to Production & Upload Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake cryptography

      - name: Install dbt Packages
        run: |
          cd dbt_project
          dbt deps --profiles-dir .

      - name: Run Production Build
        run: |
          cd dbt_project
          dbt build --target ci --profiles-dir .

      - name: Upload Production Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-production-manifest
          path: dbt_project/target/manifest.json
          retention-days: 30