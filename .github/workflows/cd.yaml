name: Continuous Deployment - Multi-Environment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - DEV
          - UAT
          - PROD

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
  SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  SNOWFLAKE_DATABASE: POC_MEDALLION_CICD

jobs:
  # ==========================================
  # 1. DEPLOY TO DEV (Automatic)
  # ==========================================
  deploy_dev:
    name: Deploy to DEV
    if: github.event.inputs.target_env == 'ALL' || github.event.inputs.target_env == 'DEV' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake cryptography PyGithub

      - name: Install dbt Packages
        run: |
          cd dbt_project
          dbt deps --profiles-dir .

      - name: Run DEV Build
        env:
          SNOWFLAKE_AUTHENTICATOR: JWT
        run: |
          cd dbt_project
          dbt build --target cd_dev --profiles-dir .

      - name: Upload Production Manifest
        uses: actions/upload-artifact@v4
        with:
          name: dbt-production-manifest
          path: dbt_project/target/manifest.json
          retention-days: 30

      - name: Update PR Status (DEV)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/workflows/update_status.py dev "🚀 Deployed to DEV"

  # ==========================================
  # 2. DEPLOY TO UAT (Approval Required)
  # ==========================================
  deploy_uat:
    name: Deploy to UAT
    needs: deploy_dev
    if: github.event.inputs.target_env == 'ALL' || github.event.inputs.target_env == 'UAT' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: UAT  # <-- Detiene la ejecución esperando 'Required Reviewers'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake cryptography PyGithub

      - name: Install dbt Packages
        run: |
          cd dbt_project
          dbt deps --profiles-dir .

      - name: Run UAT Build
        run: |
          cd dbt_project
          dbt build --target uat --profiles-dir .

      - name: Update PR Status (UAT)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/workflows/update_status.py uat "🚀 Deployed to UAT"

  # ==========================================
  # 3. DEPLOY TO PROD (Approval Required)
  # ==========================================
  deploy_prod:
    name: Deploy to PROD
    needs: deploy_uat
    if: github.event.inputs.target_env == 'ALL' || github.event.inputs.target_env == 'PROD' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: PROD  # <-- Segunda puerta de aprobación independiente

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake cryptography PyGithub

      - name: Install dbt Packages
        run: |
          cd dbt_project
          dbt deps --profiles-dir .

      - name: Run PROD Build
        run: |
          cd dbt_project
          dbt build --target prod --profiles-dir .

      - name: Update PR Status (PROD)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/workflows/update_status.py prod "🚀 Deployed to PROD"