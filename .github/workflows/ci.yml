name: Slim CI - Pull Request Validation

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, closed ]
  workflow_dispatch:  

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
  SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  SNOWFLAKE_DATABASE: POC_MEDALLION_CICD
  PR_SCHEMA: PR_BUILD_${{ github.event.number }}

jobs:
  # 1. Cleanup ephemeral PR schema in Snowflake when PR is closed
  cleanup_pr_schema:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Snowflake Connector
        run: pip install snowflake-connector-python cryptography

      - name: Drop Ephemeral PR Schema in Snowflake
        run: |
          python -c "
          import snowflake.connector, os
          from cryptography.hazmat.primitives import serialization

          p_key = os.environ['SNOWFLAKE_PRIVATE_KEY'].encode()
          private_key = serialization.load_pem_private_key(p_key, password=None)
          pk_bytes = private_key.private_bytes(
              encoding=serialization.Encoding.DER,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption()
          )

          conn = snowflake.connector.connect(
              user=os.environ['SNOWFLAKE_USER'],
              private_key=pk_bytes,
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              warehouse=os.environ['SNOWFLAKE_WAREHOUSE'],
              database=os.environ['SNOWFLAKE_DATABASE'],
              role=os.environ['SNOWFLAKE_ROLE']
          )
          cursor = conn.cursor()
          schema_name = os.environ['PR_SCHEMA']
          print(f'Dropping ephemeral schema: {schema_name}')
          cursor.execute(f'DROP SCHEMA IF EXISTS {schema_name};')
          conn.close()
          "

  # 2. Validation in open/update PR
  slim_ci:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake sqlfluff sqlfluff-templater-dbt cryptography

      - name: Install dbt Packages
        run: |
          cd dbt_project
          dbt deps --profiles-dir .

      - name: Run SQLFluff Linting
        run: |
          sqlfluff lint dbt_project/models --config .sqlfluff

      - name: Download Production Manifest via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Buscando la última ejecución exitosa del CD en main..."
          RUN_ID=$(gh run list --workflow cd.yml --branch main --status success --limit 1 --json databaseId -q ".[0].databaseId")
          
          if [ -z "$RUN_ID" ]; then
            echo "⚠️ No se encontró ninguna ejecución exitosa previa. Saltando descarga."
          else
            echo "✅ Descargando artefacto desde el Run ID: $RUN_ID"
            gh run download $RUN_ID --name dbt-production-manifest --dir dbt_project
            echo "Verificando archivo descargado:"
            ls -la dbt_project/manifest.json
          fi

      - name: Run dbt Slim CI
        id: dbt_run
        run: |
          cd dbt_project
          if [ -f "./manifest.json" ]; then
            echo "Comparison manifest found. Running Slim CI (state:modified+)..."
            dbt build --select state:modified+ --target ci --state ./ --profiles-dir .
            echo "IMPACTED_MODELS<<EOF" >> $GITHUB_ENV
            dbt ls --select state:modified+ --output name --state ./ --profiles-dir . --quiet >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "No prior manifest.json found. Executing full build on ephemeral schema..."
            dbt build --target ci --profiles-dir .
            echo "IMPACTED_MODELS=Full build executed (no base manifest available for lineage comparison)." >> $GITHUB_ENV
          fi

      - name: Post PR Comment with Semantic Impact
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = './dbt_project/target/run_results.json';
            
            if (!fs.existsSync(path)) {
              console.log('No run_results.json found.');
              return;
            }

            const runResults = JSON.parse(fs.readFileSync(path, 'utf8'));
            const results = runResults.results || [];

            let rows = results.map(res => {
              const statusEmoji = res.status === 'success' || res.status === 'pass' ? '✅' : '❌';
              const nodeType = res.unique_id.split('.')[0].toUpperCase();
              const name = res.unique_id.split('.').slice(-1)[0];
              const time = res.execution_time ? `${res.execution_time.toFixed(2)}s` : 'N/A';
              return `| ${statusEmoji} **${res.status.toUpperCase()}** | \`${nodeType}\` | \`${name}\` | ${time} |`;
            }).join('\n');

            const rawImpacted = process.env.IMPACTED_MODELS || '';
            const impactedList = rawImpacted
              .split('\n')
              .filter(line => line.trim() !== '')
              .map(model => `- \`${model.trim()}\``)
              .join('\n');

            const body = `### 📊 dbt Slim CI - PR Semantic Impact Analysis

            #### ⛓️ Downstream Lineage Impact
            The following models and tests were identified as modified or directly impacted downstream:
            ${impactedList || '_No downstream models impacted._'}

            ---

            #### 🛠️ Execution Results
            | Status | Resource Type | Model / Test Name | Execution Time |
            | :---: | :---: | :--- | :---: |
            ${rows}

            * **Target Test Schema:** \`${process.env.PR_SCHEMA}\`
            * **Total Resources Processed:** ${results.length}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });